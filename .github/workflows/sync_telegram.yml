name: Sync Telegram Wallpapers

on:
  schedule:
    # Executa todos os dias às 23:59 UTC (final do dia)
    - cron: '59 23 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  sync:
    name: Sync from Amanda Wallpaper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pillow opencv-python-headless

      - name: Run Telegram sync script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python scripts/sync_telegram.py

      - name: Commit and push new wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain wallpapers/)" ]; then
            git add wallpapers/
            git commit -m "chore(wallpapers): auto-sync wallpapers from Telegram [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated wallpapers catalog."
          else
            echo "No new wallpapers to commit."
          fi
