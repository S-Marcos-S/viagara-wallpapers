name: Approve Wallpaper Suggestion

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número da Issue de sugestão para aplicar manualmente'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  approve:
    if: >
      (
        github.event_name == 'issues' &&
        github.event.action == 'closed' &&
        github.event.issue.state_reason != 'not_planned' &&
        github.actor == github.repository_owner &&
        (contains(github.event.issue.title, '[Sugestão]') || contains(github.event.issue.labels.*.name, 'wallpaper-suggestion') || contains(github.event.issue.body, 'custom_classified'))
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'approved' &&
        github.actor == github.repository_owner
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        contains(github.event.comment.body, '/approve') &&
        contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association)
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply suggestion to catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUM: ${{ inputs.issue_number }}
          DEFAULT_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            export ISSUE_BODY=$(gh api "repos/${{ github.repository }}/issues/${DISPATCH_ISSUE_NUM}" --jq '.body')
          else
            export ISSUE_BODY="$DEFAULT_ISSUE_BODY"
          fi
          python scripts/apply_suggestion.py

      - name: Commit and push updated catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUM: ${{ inputs.issue_number }}
          EVENT_ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUM="$DISPATCH_ISSUE_NUM"
          else
            ISSUE_NUM="$EVENT_ISSUE_NUM"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain wallpapers/catalog.json)" ]; then
            git add wallpapers/catalog.json
            git commit -m "chore(catalog): apply suggestion from issue #${ISSUE_NUM} [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in catalog.json."
          fi

      - name: Close Issue with confirmation comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUM: ${{ inputs.issue_number }}
          EVENT_ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUM="$DISPATCH_ISSUE_NUM"
          else
            ISSUE_NUM="$EVENT_ISSUE_NUM"
          fi

          gh issue comment "$ISSUE_NUM" --body "✅ **Sugestão Aprovada!** As novas tags e título foram incorporados com sucesso ao catálogo oficial."
          gh issue close "$ISSUE_NUM" --reason "completed" || true
