name: Classify Existing Wallpapers
run-name: "Classify Wallpapers (batch: ${{ inputs.batch_size || '50' }}, provider: ${{ inputs.ai_classifier || 'both_with_fallback' }})"

on:
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Quantidade de papéis de parede para classificar'
        required: true
        default: '50'
        type: string
      ai_classifier:
        description: 'Classificador de Tags e Categorias'
        required: true
        default: 'both_with_fallback'
        type: choice
        options:
          - 'both_with_fallback'
          - 'gemini'
          - 'simple_ai'
      upgrade_simple:
        description: 'Aprimorar papéis de parede antigos (da Simple AI ou genéricos) com Gemini'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  classify:
    name: Classify Existing Catalog Wallpapers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          # Install lightweight CPU-only PyTorch & Torchvision for offline Simple AI
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu || echo "Torch installation skipped or failed, fallback to PIL heuristics."

      - name: Run classification on existing wallpapers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLASSIFY_PROVIDER: ${{ inputs.ai_classifier || 'both_with_fallback' }}
          MAX_CLASSIFY_PER_RUN: ${{ inputs.batch_size || '50' }}
          UPGRADE_SIMPLE_AI: ${{ github.event_name == 'schedule' || inputs.upgrade_simple != false }}
        run: |
          python scripts/classify_wallpapers.py

      - name: Commit and push updated catalog
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '50' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain wallpapers/catalog.json wallpapers/notification.json)" ]; then
            git add wallpapers/catalog.json wallpapers/notification.json
            git commit -m "chore(catalog): auto-classify ${BATCH_SIZE} wallpapers by Gemini AI [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully committed and pushed updated catalog."
          else
            echo "No changes detected in catalog.json."
          fi
