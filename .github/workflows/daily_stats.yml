name: Daily Wallpaper Statistics
run-name: "Daily Wallpaper Stats (${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }})"

on:
  schedule:
    # Executa todos os dias às 04:00 UTC (01:00 da manhã no Horário de Brasília)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite disparar manualmente a qualquer momento

permissions:
  contents: write

jobs:
  stats:
    name: Calculate & Update Wallpaper Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Wallpaper Statistics Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/wallpaper_stats.py

      - name: Commit and push updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs(stats): update daily wallpaper storage & AI statistics [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated and pushed README.md."
          else
            echo "No changes detected in README.md."
          fi
